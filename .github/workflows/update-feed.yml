name: Update custom feeds

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: custom-feeds
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate SlovLit feeds
        run: |
          python slovlit/update_feed.py
          python slovlit/update_json.py
      - name: Generate Digitalna UL feed
        run: python digitalna-ul/update_feed.py
      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain -- slovlit/feed.xml slovlit/feed.json digitalna-ul/feed.json)" ]; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add slovlit/feed.xml slovlit/feed.json digitalna-ul/feed.json
          git commit -m "Update custom feeds"
          git push
